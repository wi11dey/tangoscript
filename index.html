<!doctype html>
<html>
    <head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstati.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Playball&display=swap" rel="stylesheet">

	<title>TangoScript</title>

	<style>
	 h1 {
	     font-family: "Playball", cursive;
	     font-size: 50pt;
	 }

	 body {
	     font-family: "Arvo", serif;
	 }

	 @media only screen 
	 and (min-width : 500px) {
	     body {
		 margin-top: 0.5in;
		 margin-bottom: 0.5in;
		 margin-left: 1in;
		 margin-right: 1in;
	     }
	 }

	 textarea {
	     font-family: monospace;
	     display: block;
	     width: 100%;
	 }

	 #downloadButton {
	     display: block;
	     margin-top: 6pt;
	     margin-bottom: 6pt;
	 }

	 #canvasBox {
	     width: 100%;
	     height: 500px;
	 }

	 #canvasBox > canvas {
	     width: 100%;
	     height: 100%;
	     object-fit: scale-down;
	     margin-left: auto;
	     margin-right: auto;
	 }
	</style>
    </head>
    <body>
	<div class="jumbotron text-center">
	    <h1>TangoScript</h1>
	    <p style="margin-bottom: 0pt;">
		a programming language for <strong>tango</strong>
	    </p>
	    <p class="text-secondary">
		by Will Dey</span>, for Comparative Literature 120
	    </p>
	</div>

	<textarea id="program" name="program" rows="8" cols="80"></textarea>

	<div id="errorBox" class="alert alert-danger d-flex align-items-center" role="alert" style="display: none !important;">
	    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-label="Warning:">
		<path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
	    </svg>
	    <div id="errorText"></div>
	</div>

	<a id="downloadButton" class="btn btn-primary" href="" download="dance.tango">Save</a>

	<!-- <div class="btn-group" role="group" aria-label="Role">
	     <input type="radio" class="btn-check" name="roleRadio" id="leaderRadio" autocomplete="off" checked>
	     <label class="btn btn-outline-dark" for="leaderRadio">Leader</label>
	     <input type="radio" class="btn-check" name="roleRadio" id="followerRadio" autocomplete="off">
	     <label class="btn btn-outline-danger" for="followerRadio">Follower</label>
	     </div> -->

	<div id="canvasBox">
	    <canvas id="floorCanvas" width="500" height="500">
	    </canvas>
	</div>

	<script>
	 var floorCanvas = document.getElementById("floorCanvas"),
	     floorCtx = floorCanvas.getContext("2d"),
	     programArea = document.getElementById("program"),
	     errorBox = document.getElementById("errorBox"),
	     errorText = document.getElementById("errorText"),
	     downloadButton = document.getElementById("downloadButton"),
	     leaderLeft = true,
	     followerLeft = false,
	     pos = [325, 250],
	     steps = 0;

	 floorCtx.setLineDash([5, 3]);
	 floorCtx.strokeStyle = "black";

	 class TangoError extends Error {
	     constructor(...params) {
		 super(...params);

		 if (Error.captureStackTrace) {
		     Error.captureStackTrace(this, TangoError);
		 }

		 this.name = "TangoError";
		 this.date = new Date();
	     }
	 }

	 function draw_couple(position) {
	     if (position === undefined) {
		 position = pos;
	     }
	     floorCtx.textAlign = "center";
	     floorCtx.font = "24px Arial";
	     floorCtx.clearRect(position[0] - 10, position[1] - 32, 20, 50);
	     floorCtx.fillStyle = "black";
	     floorCtx.fillText(leaderLeft ? "L" : "R", position[0], position[1] + 12);
	     floorCtx.fillStyle = "red";
	     floorCtx.fillText(followerLeft ? "L" : "R", position[0], position[1] - 12);
	 }

	 function execute_step({ delta, leaderStepWithLeft, followerStepWithLeft, leaderAnnotation, followerAnnotation }) {
	     if (leaderStepWithLeft == leaderLeft) {
		 throw new TangoError(`Leader on wrong foot after ${steps} steps (supposed to be on ${!leaderStepWithLeft ? "left" : "right"}, but is on ${leaderLeft ? "left" : "right"})`);
	     }
	     if (followerStepWithLeft == followerLeft) {
		 throw new TangoError(`Follower on wrong foot after ${steps} steps (supposed to be on ${!followerStepWithLeft ? "left" : "right"}, but is on ${followerLeft ? "left" : "right"})`);
	     }
	     floorCtx.beginPath();
	     floorCtx.moveTo(...pos);
	     oldPos = [...pos];
	     pos[0] += delta[0];
	     pos[1] += delta[1];
	     floorCtx.lineTo(...pos);
	     floorCtx.stroke();
	     draw_couple(oldPos);
	     leaderLeft = !leaderLeft;
	     followerLeft = !followerLeft;
	     draw_couple();
	     floorCtx.textAlign = "left";
	     floorCtx.fillStyle = "gray";
	     floorCtx.font = "12px Arial";
	     floorCtx.fillText(leaderAnnotation ? leaderAnnotation : "", pos[0] + 10, pos[1] + 10);
	     floorCtx.fillText(followerAnnotation ? followerAnnotation : "", pos[0] + 10, pos[1] - 14);
	     steps++;
	 }

	 function salida_basica(start, stop) {
	     var steps = [
		 {
		     delta: [0, 75],
		     leaderStepWithLeft: false,
		     followerStepWithLeft: true
		 },
		 {
		     delta: [-125, 0],
		     leaderStepWithLeft: true,
		     followerStepWithLeft: false
		 },
		 {
		     delta: [0, -75],
		     leaderStepWithLeft: false,
		     followerStepWithLeft: true
		 },
		 {
		     delta: [0, -75],
		     leaderStepWithLeft: true,
		     followerStepWithLeft: false
		 },
		 {
		     delta: [0, 0],
		     leaderStepWithLeft: false,
		     followerStepWithLeft: true,
		     leaderAnnotation: "Cambio de peso",
		     followerAnnotation: "Uncross"
		 },
		 {
		     delta: [0, -75],
		     leaderStepWithLeft: true,
		     followerStepWithLeft: false
		 },
		 {
		     delta: [125, 0],
		     leaderStepWithLeft: false,
		     followerStepWithLeft: true
		 },
		 {
		     delta: [0, 75],
		     leaderStepWithLeft: true,
		     followerStepWithLeft: false
		 }
	     ];
	     for (var i = start - 1; i < stop; i++) {
		 if (i < 0 || i > steps.length) {
		     throw new TangoError(`No such step in the salida basica: ${i + 1}`);
		 }
		 execute_step(steps[i]);
	     }
	 }

	 function salida_crusada(start, stop) {
	 }

	 function cambio_de_peso() {
	     execute_step({
		 delta: [0, 0],
		 leaderStepWithLeft: false,
		 followerStepWithLeft: true,
		 leaderAnnotation: "Cambio de peso"
	     });
	 }

	 function secret_step(){
	     execute_step({
		 delta: [0, 0],
		 leaderStepWithLeft: false,
		 followerStepWithLeft: true,
		 leaderAnnotation: "Cambio de peso\n(secret)"
	     });
	     followerLeft = !followerLeft;
	 }

	 function rebote() {
	 }

	 function repaint() {
	     errorBox.style.setProperty("display", "none", "important");
	     downloadButton.setAttribute("href", "data:text/plain;charset=utf-8," + encodeURIComponent(programArea.value));
	     leaderLeft = true;
	     followerLeft = false;
	     pos = [325, 250];
	     floorCtx.clearRect(0, 0, floorCanvas.width, floorCanvas.height);
	     draw_couple();
	     try {
		 eval(programArea.value);
	     } catch (e) {
		 errorBox.style.display = "flex";
		 errorText.innerText = e.toString();
	     }
	 }

	 if (programArea.addEventListener) {
	     programArea.addEventListener("input", repaint);
	 } else if (programArea.attachEvent) {
	     programArea.attachEvent("onpropertychange", repaint);
	 }

	 repaint();
	</script>
    </body>
</html>
